name: "PyDeck"
version: "0.2.0"
slug: "pydeck"
description: "Python project manager and isolated terminal runtime for Home Assistant"
url: "https://github.com/example/pydeck"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:console-line
panel_title: PyDeck
panel_admin: true
homeassistant_api: true
map:
  - type: addon_config
    read_only: false
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
